<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LOREAL method diagram</title>
  <desc id="desc">Low-resolution visual features are converted into attribute prompt tokens and distilled between standard-resolution and low-resolution students.</desc>
  <style>
    .panel-title { font: 800 22px Arial, Helvetica, sans-serif; fill: #ffffff; }
    .small { font: 600 15px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
    .chip { font: 800 14px Arial, Helvetica, sans-serif; fill: #0f172a; }
    .formula { font: 750 18px "SFMono-Regular", Consolas, monospace; fill: #e0faff; }
    .flow { stroke-dasharray: 10 12; animation: flow 1.4s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @keyframes pulse { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1020"/>
      <stop offset=".55" stop-color="#10243a"/>
      <stop offset="1" stop-color="#17112d"/>
    </linearGradient>
    <linearGradient id="edge" x1="90" y1="210" x2="1190" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset=".52" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".055"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10Z" fill="#a7f3d0"/>
    </marker>
  </defs>

  <rect width="1280" height="420" rx="26" fill="url(#bg)"/>
  <path d="M0 333C163 291 270 355 430 306C610 251 705 89 918 128C1080 158 1165 257 1280 214V420H0V333Z" fill="#38bdf8" opacity=".07"/>

  <g filter="url(#shadow)">
    <rect x="72" y="90" width="300" height="230" rx="22" fill="url(#panel)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="490" y="90" width="300" height="230" rx="22" fill="url(#panel)" stroke="#22c55e" stroke-width="2"/>
    <rect x="908" y="90" width="300" height="230" rx="22" fill="url(#panel)" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <g transform="translate(72 90)">
    <text x="30" y="44" class="panel-title">Low-res image</text>
    <g transform="translate(42 82)">
      <rect width="35" height="35" fill="#ef4444"/>
      <rect x="41" width="35" height="35" fill="#f59e0b"/>
      <rect x="82" width="35" height="35" fill="#22c55e"/>
      <rect x="123" width="35" height="35" fill="#38bdf8"/>
      <rect y="41" width="35" height="35" fill="#a855f7"/>
      <rect x="41" y="41" width="35" height="35" fill="#06b6d4"/>
      <rect x="82" y="41" width="35" height="35" fill="#84cc16"/>
      <rect x="123" y="41" width="35" height="35" fill="#fb7185"/>
    </g>
    <circle cx="220" cy="122" r="42" fill="#e0f2fe"/>
    <text x="206" y="128" class="chip">f_v</text>
    <text x="36" y="196" class="small">visual cues survive resolution loss</text>
  </g>

  <path d="M392 205H470" stroke="url(#edge)" stroke-width="5" marker-end="url(#arrow)" class="flow"/>

  <g transform="translate(490 90)">
    <text x="30" y="44" class="panel-title">Attribute meta-nets</text>
    <text x="44" y="88" class="formula">S_k = M_k(f_v)</text>
    <g transform="translate(34 120)">
      <rect width="86" height="32" rx="8" fill="#38bdf8"/><text x="24" y="21" class="chip">color</text>
      <rect x="96" width="86" height="32" rx="8" fill="#22c55e"/><text x="119" y="21" class="chip">shape</text>
      <rect x="192" width="64" height="32" rx="8" fill="#f59e0b"/><text x="211" y="21" class="chip">size</text>
      <rect y="46" width="112" height="32" rx="8" fill="#f472b6"/><text x="23" y="67" class="chip">structure</text>
      <rect x="124" y="46" width="96" height="32" rx="8" fill="#a78bfa"/><text x="146" y="67" class="chip">outline</text>
    </g>
    <text x="36" y="206" class="small">attributes become visual prompt tokens</text>
  </g>

  <path d="M810 205H888" stroke="url(#edge)" stroke-width="5" marker-end="url(#arrow)" class="flow"/>

  <g transform="translate(908 90)">
    <text x="30" y="44" class="panel-title">Self-distillation</text>
    <rect x="44" y="86" width="98" height="48" rx="11" fill="#dbeafe"/>
    <text x="61" y="116" class="chip">alpha HR</text>
    <rect x="168" y="86" width="98" height="48" rx="11" fill="#dcfce7"/>
    <text x="185" y="116" class="chip">beta LR</text>
    <path d="M146 102H164" stroke="#93f5ff" stroke-width="4" marker-end="url(#arrow)" class="flow"/>
    <path d="M164 122H146" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)" class="flow"/>
    <rect x="52" y="166" width="82" height="31" rx="8" fill="#38bdf8" class="pulse"/>
    <text x="78" y="186" class="chip">LLD</text>
    <rect x="176" y="166" width="82" height="31" rx="8" fill="#f59e0b" class="pulse"/>
    <text x="202" y="186" class="chip">HLD</text>
  </g>

  <g transform="translate(258 358)">
    <rect width="764" height="34" rx="17" fill="#020617" opacity=".72" stroke="#334155"/>
    <text x="26" y="23" class="formula">A photo of a [CLASS] with S1 [color] S2 [shape] ... SK [attribute]</text>
  </g>
</svg>
