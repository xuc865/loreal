<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LOREAL attribute-driven self-distillation overview</title>
  <desc id="desc">Animated overview of low-resolution prompt learning with dual students, attribute meta-nets, low-level distillation, and high-level distillation.</desc>
  <style>
    .title { font: 800 76px Arial, Helvetica, sans-serif; letter-spacing: 8px; fill: #ffffff; }
    .subtitle { font: 600 24px Arial, Helvetica, sans-serif; fill: #d8f6ff; }
    .label { font: 700 23px Arial, Helvetica, sans-serif; fill: #ffffff; }
    .small { font: 600 17px Arial, Helvetica, sans-serif; fill: #d7e9ff; }
    .tiny { font: 700 14px Arial, Helvetica, sans-serif; fill: #0b1020; }
    .code { font: 700 18px "SFMono-Regular", Consolas, monospace; fill: #eafcff; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
    .float-a { animation: floatA 5.2s ease-in-out infinite; }
    .float-b { animation: floatB 4.7s ease-in-out infinite; }
    .dash { stroke-dasharray: 12 14; animation: dash 1.6s linear infinite; }
    .glow { filter: url(#glow); }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
    @keyframes dash { to { stroke-dashoffset: -52; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.35" stop-color="#12343b"/>
      <stop offset="0.7" stop-color="#271747"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="hot" x1="160" y1="90" x2="1060" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35f6ff"/>
      <stop offset="0.45" stop-color="#6aff8f"/>
      <stop offset="1" stop-color="#ffcf5a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.92 0 0 0 0 1 0 0 0 .75 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10Z" fill="#7df9ff"/>
    </marker>
  </defs>

  <rect width="1280" height="520" rx="32" fill="url(#bg)"/>
  <path d="M0 388C154 328 258 438 412 378C604 304 689 90 905 140C1064 177 1129 297 1280 235V520H0V388Z" fill="#35f6ff" opacity=".06"/>
  <path d="M80 88C245 28 418 46 570 104C759 176 875 176 1028 103C1115 62 1198 57 1280 74" stroke="url(#hot)" stroke-width="3" opacity=".45" class="dash"/>

  <circle cx="116" cy="386" r="72" fill="#35f6ff" opacity=".16" class="pulse"/>
  <circle cx="1172" cy="116" r="84" fill="#ffcf5a" opacity=".14" class="pulse"/>
  <circle cx="1018" cy="430" r="52" fill="#6aff8f" opacity=".16" class="pulse"/>

  <text x="72" y="104" class="title">LOREAL</text>
  <text x="76" y="148" class="subtitle">Low-resolution prompt learning with attribute-driven self-distillation</text>

  <g transform="translate(76 184)">
    <rect width="270" height="188" rx="24" fill="url(#card)" stroke="#65e4ff" stroke-opacity=".55"/>
    <text x="28" y="42" class="label">Low-res input</text>
    <g transform="translate(30 66)">
      <rect width="26" height="26" fill="#ff6b6b"/>
      <rect x="32" width="26" height="26" fill="#ffd166"/>
      <rect x="64" width="26" height="26" fill="#06d6a0"/>
      <rect x="96" width="26" height="26" fill="#4cc9f0"/>
      <rect y="32" width="26" height="26" fill="#6aff8f"/>
      <rect x="32" y="32" width="26" height="26" fill="#577cff"/>
      <rect x="64" y="32" width="26" height="26" fill="#ffcf5a"/>
      <rect x="96" y="32" width="26" height="26" fill="#35f6ff"/>
      <rect y="64" width="26" height="26" fill="#f72585"/>
      <rect x="32" y="64" width="26" height="26" fill="#8ecae6"/>
      <rect x="64" y="64" width="26" height="26" fill="#b8f7d4"/>
      <rect x="96" y="64" width="26" height="26" fill="#ffafcc"/>
    </g>
    <text x="30" y="174" class="small">blurred pixels, preserved cues</text>
  </g>

  <g transform="translate(432 166)" class="float-a">
    <rect width="386" height="232" rx="28" fill="#061423" stroke="url(#hot)" stroke-width="3"/>
    <text x="30" y="45" class="label">Attribute meta-nets</text>
    <text x="30" y="78" class="code">S_k = M_k(f_v)</text>
    <g transform="translate(30 104)">
      <rect width="92" height="34" rx="17" fill="#35f6ff"/><text x="21" y="23" class="tiny">color</text>
      <rect x="104" width="92" height="34" rx="17" fill="#6aff8f"/><text x="122" y="23" class="tiny">shape</text>
      <rect x="208" width="92" height="34" rx="17" fill="#ffcf5a"/><text x="231" y="23" class="tiny">size</text>
      <rect y="48" width="122" height="34" rx="17" fill="#ff7bd5"/><text x="18" y="71" class="tiny">structure</text>
      <rect x="138" y="48" width="112" height="34" rx="17" fill="#a78bfa"/><text x="161" y="71" class="tiny">outline</text>
    </g>
    <path d="M36 194H345" stroke="#7df9ff" stroke-width="5" stroke-linecap="round" class="dash"/>
    <text x="30" y="222" class="small">visual semantics become prompt tokens</text>
  </g>

  <g transform="translate(910 180)" class="float-b">
    <rect width="292" height="202" rx="26" fill="url(#card)" stroke="#fef08a" stroke-opacity=".65"/>
    <text x="26" y="43" class="label">Dual students</text>
    <rect x="28" y="70" width="105" height="52" rx="16" fill="#e0f2fe"/>
    <text x="52" y="103" class="tiny">alpha HR</text>
    <rect x="158" y="70" width="105" height="52" rx="16" fill="#dcfce7"/>
    <text x="184" y="103" class="tiny">beta LR</text>
    <path d="M136 92C154 74 166 74 184 92" stroke="#7df9ff" stroke-width="4" fill="none" marker-end="url(#arrow)" class="dash"/>
    <path d="M184 112C166 132 154 132 136 112" stroke="#fef08a" stroke-width="4" fill="none" marker-end="url(#arrow)" class="dash"/>
    <rect x="34" y="148" width="96" height="32" rx="16" fill="#35f6ff"/>
    <text x="65" y="169" class="tiny">LLD</text>
    <rect x="158" y="148" width="96" height="32" rx="16" fill="#ffcf5a"/>
    <text x="188" y="169" class="tiny">HLD</text>
  </g>

  <path d="M350 278H424" stroke="#7df9ff" stroke-width="5" marker-end="url(#arrow)" class="dash glow"/>
  <path d="M824 278H902" stroke="#7df9ff" stroke-width="5" marker-end="url(#arrow)" class="dash glow"/>

  <g transform="translate(76 430)">
    <text class="code">A photo of a [CLASS] with S1 [color] S2 [shape] S3 [size] S4 [structure] S5 [outline]</text>
  </g>
</svg>
